<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal Sender</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Send to terminal</h1>
      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Type a message"></textarea>
      <button id="sendBtn" type="button">Send to terminal</button>
      <label for="phoneNumber">Phone number</label>
      <input id="phoneNumber" type="text" placeholder="+1 555 123 4567" />
      <button id="sendDialBtn" type="button" class="secondary">Send dial request</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
